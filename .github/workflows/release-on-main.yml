name: Publish versioned GitHub release

on:
  push:
    branches:
      - main
    paths:
      - "app.config.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-second-montage-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the released main commit
        uses: actions/checkout@v6

      - name: Set up Node.js for regression checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and validate the standalone variants
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Package and publish new version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Get-Content -LiteralPath 'app.config.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$app.version -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Expected a semantic app version.'
          }
          $tag = "v$($app.version)"
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. No new tag or release will be created."
            exit 0
          }

          $dir = Join-Path $env:RUNNER_TEMP 'montage-release'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $baseName = "htmlapps-one-second-montage-$tag"
          $readable = Join-Path $dir "$baseName.html"
          $compact = Join-Path $dir "$baseName.self-extract.html"
          $archive = Join-Path $dir "$baseName.zip"
          $checksumFile = Join-Path $dir 'SHA256SUMS.txt'
          Copy-Item -LiteralPath 'dist/index.html' -Destination $readable
          Copy-Item -LiteralPath 'dist/index.self-extract.html' -Destination $compact
          Compress-Archive -LiteralPath @($readable, $compact, 'README.md', 'README.ja.md', 'LICENSE') -DestinationPath $archive -CompressionLevel Optimal

          $hashes = foreach ($file in @($readable, $compact, $archive)) {
            $name = Split-Path -Leaf $file
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          [System.IO.File]::WriteAllLines($checksumFile, [string[]]$hashes, [System.Text.UTF8Encoding]::new($false))

          gh release create $tag $readable $compact $archive $checksumFile --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "One Second Montage $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "GitHub release $tag failed." }
          Write-Host "Published $tag and its standalone HTML assets."
